[package]
name = "custom-qbsi"
version = "1.0.0"
description = "QuickBooks Desktop Sales Invoice & Receipt Printing Application"
authors = ["Custom QBSI Solutions"]
edition = "2021"

[lib]
name = "custom_qbsi_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
chrono = { version = "0.4", features = ["serde"] }
windows = { version = "0.62.2", features = [
    "Win32_Foundation",
    "Win32_System_Com",
    "Win32_System_Variant",
    "Win32_System_Ole",
] }
windows-core = "0.62.2"
