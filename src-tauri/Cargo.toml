[package]
name = "custom-qbsi"
version = "1.0.0"
description = "QuickBooks Sales Invoice & Receipt System (Tauri + React)"
authors = ["Tetsuro"]
edition = "2021"

[lib]
name = "custom_qbsi_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
chrono = { version = "0.4", features = ["serde"] }
